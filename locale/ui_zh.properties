tools/entity_editor/hint = 左边是带搜索的列表，右边是所选条目的字段 · Ctrl+N 新建，Ctrl+D 复制 · Ctrl+Z/Y 撤销/重做 · Ctrl+S 保存，游戏会立即看到更改
