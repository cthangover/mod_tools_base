tools/entity_editor/added = 항목 {0}을(를) {1}에 추가했습니다
tools/entity_editor/deleted = 항목 {0}을(를) 삭제했습니다(기록하려면 저장)
tools/entity_editor/saved = 저장함: 파일 {0}개, 텍스트 {1}개 (모드 {2}). 게임이 데이터를 다시 읽었습니다
tools/entity_editor/broken_files = JSON이 깨진 파일은 읽지 않았습니다: {0}
tools/entity_editor/problem_id = 파일 {0}에 id가 비어 있는 항목이 있습니다
tools/entity_editor/problem_duplicate = id {0}이(가) 두 번 이상 나옵니다
tools/entity_editor/show_foreign = 다른 모드의 항목
tools/entity_editor/show_foreign_tip = 이 모드가 의존하는 모드의 항목을 표시합니다. 수정은 이 모드의 패치로 저장되고 소유 모드의 파일은 바뀌지 않습니다
tools/entity_editor/reset = 상속값으로 되돌리기
tools/entity_editor/reset_tip = 이 항목에 대한 이 모드의 패치를 제거합니다. 게임은 다시 소유 모드의 값을 봅니다
tools/entity_editor/reset_field_tip = 이 필드의 내 값(파일 또는 패치)을 제거합니다. 상속값이 돌아옵니다
tools/entity_editor/reset_field_done = {1}의 필드 {0}을(를) 상속값으로 되돌렸습니다(저장하면 기록)
