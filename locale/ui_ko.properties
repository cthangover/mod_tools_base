tools/entity_editor/foreign_file = 모드 {0}의 항목 · 파일 {1}. 수정은 {2}/{3}에 패치로 저장되며 모드 {0}의 파일은 바뀌지 않습니다.
tools/entity_editor/foreign_deleted = 이 모드의 패치로 삭제됨($delete). "상속값으로 되돌리기"로 복구합니다.
tools/entity_editor/foreign_unresolved = 항목 {0}의 최종값을 얻지 못했습니다. 다른 모드가 삭제했거나 파일을 읽을 수 없습니다
tools/entity_editor/deleted_foreign = 저장하면 항목 {0}은(는) 이 모드의 패치($delete)로 삭제됩니다. 소유 모드의 파일은 바뀌지 않습니다
tools/entity_editor/badge_own_patch = ✎ 이 모드의 패치 값
tools/entity_editor/badge_own_overridden = ⚠ 모드 {0}의 패치가 나중에 적용되어 내 값을 덮습니다 — 게임 값은 {1}
tools/entity_editor/badge_patched_by = ⚑ 모드 {0}의 패치로 변경됨
tools/entity_editor/badge_overridden = ⚠ 모드 {0}의 패치가 내 값을 덮습니다 — 게임 값은 {1}
tools/entity_editor/badge_inherited = ↑ {0}에서 상속(모드 {1})
tools/entity_editor/numbers_invalid = 숫자를 읽을 수 없습니다: «{0}». 쉼표로 구분하고 소수점은 마침표를 쓰세요
